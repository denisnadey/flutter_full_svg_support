name: Android Native Link

on:
  pull_request:
    paths:
      - "lib/**"
      - "packages/quickjs_engine/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-native-link.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "packages/quickjs_engine/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-native-link.yml"
  workflow_dispatch:

concurrency:
  group: android-native-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64_release:
    name: Android arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Android native toolchain
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Create clean Flutter app
        run: |
          flutter create --platforms android "$RUNNER_TEMP/quickjs_android_smoke"

      - name: Add local quickjs_engine dependency
        working-directory: ${{ runner.temp }}/quickjs_android_smoke
        run: |
          if [ -f android/app/build.gradle ]; then
            ruby -0pi -e 'sub(/ndkVersion\s*=\s*flutter\.ndkVersion/, "ndkVersion = \"27.0.12077973\"")' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            ruby -0pi -e 'sub(/ndkVersion\s*=\s*flutter\.ndkVersion/, "ndkVersion = \"27.0.12077973\"")' android/app/build.gradle.kts
          fi
          flutter pub add quickjs_engine --path "$GITHUB_WORKSPACE/packages/quickjs_engine"

      - name: Build Android release arm64
        working-directory: ${{ runner.temp }}/quickjs_android_smoke
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi -v

      - name: Verify Android 16 KB alignment
        working-directory: ${{ runner.temp }}/quickjs_android_smoke
        shell: bash
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          extracted_dir="$RUNNER_TEMP/quickjs_android_arm64_libs"
          ndk_root="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          readelf="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          test -f "$apk"
          test -x "$readelf"
          mkdir -p "$extracted_dir"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$extracted_dir"

          library_count=0
          while IFS= read -r library; do
            library_count=$((library_count + 1))
            load_count=0
            while IFS= read -r segment_alignment; do
              load_count=$((load_count + 1))
              if (( segment_alignment < 0x4000 )); then
                echo "::error file=$library::ELF LOAD alignment is $segment_alignment; expected at least 0x4000"
                exit 1
              fi
            done < <("$readelf" -lW "$library" | awk '$1 == "LOAD" { print $NF }')
            test "$load_count" -gt 0
          done < <(find "$extracted_dir/lib/arm64-v8a" -type f -name '*.so' -print)
          test "$library_count" -gt 0

          zipalign="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -n "$zipalign"
          test -x "$zipalign"
          "$zipalign" -c -P 16 -v 4 "$apk"

  agp9_builtin_kotlin:
    # Regression guard for #52: quickjs_engine must not apply the Kotlin Gradle
    # Plugin (KGP). With AGP 9 built-in Kotlin enabled, a plugin that applies
    # KGP fails to configure; with it disabled, Flutter prints a "plugins that
    # apply Kotlin Gradle Plugin (KGP)" warning instead. Build both ways.
    name: Android AGP 9 built-in Kotlin (latest stable Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android CMake
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "cmake;3.22.1"

      - name: Create clean Flutter app
        run: |
          flutter --version
          flutter create --platforms android "$RUNNER_TEMP/quickjs_agp9_smoke"

      - name: Require AGP 9 and add local quickjs_engine dependency
        working-directory: ${{ runner.temp }}/quickjs_agp9_smoke
        shell: bash
        run: |
          set -euo pipefail
          settings=android/settings.gradle.kts
          [ -f "$settings" ] || settings=android/settings.gradle
          test -f "$settings"
          agp_line="$(grep -E 'com\.android\.application' "$settings" | grep -E 'version' | head -n 1 || true)"
          agp_version="$(printf '%s\n' "$agp_line" | grep -Eo '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1 || true)"
          echo "Template AGP version: ${agp_version:-<not found>}"
          if [ -z "$agp_version" ] || [ "${agp_version%%.*}" -lt 9 ]; then
            echo "::error::Expected the latest stable Flutter template to use AGP 9+, found '${agp_version:-<none>}' in $settings"
            exit 1
          fi
          flutter pub add quickjs_engine --path "$GITHUB_WORKSPACE/packages/quickjs_engine"

      - name: Build release APK with built-in Kotlin enabled and disabled
        working-directory: ${{ runner.temp }}/quickjs_agp9_smoke
        shell: bash
        run: |
          set -euo pipefail

          props=android/gradle.properties

          set_builtin_kotlin() {
            # Flutter's migrator appends android.builtInKotlin=false when the
            # flag is missing, so always write the value explicitly.
            touch "$props"
            grep -Ev '^[[:space:]]*android\.builtInKotlin[[:space:]]*[=:]' "$props" > "$props.tmp" || true
            mv "$props.tmp" "$props"
            printf '\nandroid.builtInKotlin=%s\n' "$1" >> "$props"
          }

          build_and_check() {
            local mode="$1"
            local log="$RUNNER_TEMP/quickjs_agp9_builtInKotlin_${mode}.log"
            set_builtin_kotlin "$mode"
            echo "::group::flutter build apk (android.builtInKotlin=$mode)"
            cat "$props"
            flutter build apk --release --target-platform android-arm64 2>&1 | tee "$log"
            echo "::endgroup::"

            if ! grep -Eq "^[[:space:]]*android\.builtInKotlin[[:space:]]*=[[:space:]]*${mode}[[:space:]]*$" "$props"; then
              echo "::error::android.builtInKotlin=$mode was not in effect for the build"
              cat "$props"
              exit 1
            fi
            if grep -E 'apply Kotlin Gradle Plugin \(KGP\):.*quickjs_engine' "$log"; then
              echo "::error::Flutter reports that quickjs_engine applies the Kotlin Gradle Plugin (android.builtInKotlin=$mode)"
              exit 1
            fi
            test -f build/app/outputs/flutter-apk/app-release.apk
          }

          # Enabled is the AGP 9 default and the configuration that failed in #52.
          build_and_check true
          # Disabled is what `flutter create` currently generates and where
          # Flutter prints its KGP warning.
          build_and_check false
