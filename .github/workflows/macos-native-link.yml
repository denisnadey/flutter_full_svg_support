name: macOS Native Link

on:
  pull_request:
    paths:
      - "packages/quickjs_engine/**"
      - ".github/workflows/macos-native-link.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "packages/quickjs_engine/**"
      - ".github/workflows/macos-native-link.yml"
  workflow_dispatch:

concurrency:
  group: macos-native-link-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal_release:
    name: macOS universal release
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Verify shipped bridge is universal
        run: |
          bridge="packages/quickjs_engine/macos/Frameworks/libquickjs_c_bridge_plugin.dylib"
          test -f "$bridge"
          lipo -verify_arch x86_64 arm64 "$bridge"

      - name: Rebuild universal bridge
        working-directory: packages/quickjs_engine
        run: sh tool/build_native.sh

      - name: Verify rebuilt bridge is universal
        run: |
          bridge="packages/quickjs_engine/macos/Frameworks/libquickjs_c_bridge_plugin.dylib"
          lipo -verify_arch x86_64 arm64 "$bridge"

      - name: Create clean Flutter app
        run: flutter create --platforms macos "$RUNNER_TEMP/quickjs_macos_smoke"

      - name: Add local quickjs_engine dependency
        working-directory: ${{ runner.temp }}/quickjs_macos_smoke
        run: flutter pub add quickjs_engine --path "$GITHUB_WORKSPACE/packages/quickjs_engine"

      - name: Build macOS release
        working-directory: ${{ runner.temp }}/quickjs_macos_smoke
        run: flutter build macos --release

      - name: Verify app and embedded bridge are universal
        working-directory: ${{ runner.temp }}/quickjs_macos_smoke
        run: |
          app="build/macos/Build/Products/Release/quickjs_macos_smoke.app"
          executable="$app/Contents/MacOS/quickjs_macos_smoke"
          bridge="$app/Contents/Frameworks/libquickjs_c_bridge_plugin.dylib"

          test -f "$executable"
          test -f "$bridge"
          lipo -verify_arch x86_64 arm64 "$executable"
          lipo -verify_arch x86_64 arm64 "$bridge"
